[Settings]

# Maximum allowed packet size in bytes.
# Packets larger than this are discarded. default = 16 KB
MaxBufferSize=16384

# Maximum number of stream chunks that may be queued
# simultaneously for a single client.
MaxQueuedStreamChunks=4

# Number of worker threads executing normal commands.
CommandThreads=2

# Number of worker threads processing stream data.
StreamThreads=4